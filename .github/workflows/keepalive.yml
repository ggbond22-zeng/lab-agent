# Render 免费实例 15 分钟无访问会自动休眠（下次请求要等 30~50 秒唤醒）。
# 这个工作流每 10 分钟 ping 一次后端首页，让平台一直判定"实例活跃"。
# 注意：GitHub 对 60 天没有任何提交的仓库会自动停用定时工作流，
#       届时到仓库 Actions 页面手动重新启用即可。
name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分钟执行一次
  workflow_dispatch:          # 允许在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl -sSf --max-time 30 https://lab-agent-qy38.onrender.com/
