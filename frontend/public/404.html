<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>智能实验室预约系统</title>
    <script>
      // GitHub Pages 不支持 history 路由的子路径（如 /lab-agent/manager/home 会 404）
      // 思路：把用户实际访问的完整地址存入 sessionStorage，然后跳回真正的应用入口 /lab-agent/
      // 应用加载时（index.html 里的脚本）会读回这个地址并还原，用户无感知
      sessionStorage.redirect = location.href;
      location.replace('/lab-agent/');
    </script>
  </head>
  <body></body>
</html>
